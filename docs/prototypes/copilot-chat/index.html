<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'"
    />
    <title>Fruits & Légumes — maquette du copilote</title>
    <style>
      :root {
        --bg: #f5f6f0;
        --ink: #192d25;
        --muted: #59685f;
        --line: #dfe6dd;
        --accent: #235c3d;
        --soft: #e7f1ea;
        --surface: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--ink);
        font-synthesis: none;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
      }
      button,
      input,
      textarea,
      select {
        font: inherit;
      }
      button {
        cursor: pointer;
        color: inherit;
      }
      button:focus-visible,
      input:focus-visible,
      textarea:focus-visible,
      select:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }
      button:disabled {
        cursor: default;
        opacity: 0.5;
      }
      .demo {
        height: 40px;
        padding: 0 18px;
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 12px;
        border-bottom: 1px solid var(--line);
        color: var(--muted);
      }
      .demo strong {
        font-weight: 500;
      }
      .demo select {
        max-width: 190px;
        background: transparent;
        border: 0;
        font-size: 12px;
        color: var(--ink);
      }
      .demo .spacer {
        flex: 1;
      }
      .demo button {
        border: 0;
        background: none;
        font-size: 12px;
      }
      .app {
        display: flex;
        background: var(--surface);
        height: calc(100dvh - 40px);
        min-height: 500px;
      }
      .sidebar {
        width: 242px;
        flex: none;
        background: var(--bg);
        padding: 24px 14px;
        display: flex;
        flex-direction: column;
        border-right: 1px solid var(--line);
        gap: 14px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 9px;
        font-size: 14px;
        font-weight: 650;
        padding: 0 10px;
        letter-spacing: 0.02em;
      }
      .brand svg {
        color: var(--accent);
      }
      .new {
        display: flex;
        align-items: center;
        gap: 9px;
        text-align: left;
        background: transparent;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px;
        margin-top: 15px;
        font-size: 14px;
      }
      .nav-title {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.09em;
        color: var(--muted);
        padding: 12px 10px 0;
      }
      .conversation {
        display: block;
        width: 100%;
        background: transparent;
        border: 0;
        text-align: left;
        padding: 12px 10px;
        border-radius: 9px;
        font-size: 14px;
        margin: 2px 0;
      }
      .conversation.active {
        background: var(--soft);
      }
      .sidebar-bottom {
        margin-top: auto;
      }
      .sidebar-bottom button {
        display: flex;
        align-items: center;
        gap: 9px;
        border: 0;
        background: none;
        padding: 12px 10px;
        font-size: 13px;
      }
      .profile {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 12px 10px;
        font-size: 13px;
      }
      .initials {
        display: grid;
        place-items: center;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: var(--soft);
        font-size: 12px;
      }
      .main {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        position: relative;
      }
      .top {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 65px;
        padding: 0 24px;
      }
      .top h1 {
        font-size: 16px;
        font-weight: 600;
        margin: 0;
      }
      .top .spacer {
        flex: 1;
      }
      .store {
        font-size: 12px;
        color: var(--muted);
      }
      .icon {
        width: 40px;
        height: 40px;
        border: 0;
        border-radius: 9px;
        background: transparent;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex: none;
      }
      .icon:hover {
        background: var(--bg);
      }
      svg {
        width: 20px;
        height: 20px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .menu-toggle {
        display: none;
      }
      .status {
        font-size: 11px;
        color: #8a5600;
        background: #fff2d8;
        padding: 6px 9px;
        border-radius: 20px;
      }
      .stream {
        flex: 1;
        overflow: auto;
        scroll-behavior: smooth;
        padding: 16px 24px 24px;
      }
      .thread {
        max-width: 710px;
        margin: auto;
      }
      .welcome {
        max-width: 620px;
        margin: clamp(35px, 12vh, 120px) auto 30px;
        text-align: center;
      }
      .welcome .mark {
        width: 42px;
        height: 42px;
        color: var(--accent);
        margin-bottom: 20px;
      }
      .welcome h2 {
        font-size: 28px;
        letter-spacing: -0.03em;
        font-weight: 600;
        margin: 0 0 12px;
      }
      .welcome p {
        color: var(--muted);
        font-size: 15px;
        line-height: 1.55;
        margin: 0 auto 25px;
        max-width: 370px;
      }
      .suggestions {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 8px;
      }
      .suggestions button,
      .soft-button {
        border: 1px solid var(--line);
        background: #fff;
        border-radius: 18px;
        padding: 10px 13px;
        font-size: 13px;
      }
      .message {
        margin: 0 0 26px;
        font-size: 15px;
        line-height: 1.65;
        overflow-wrap: anywhere;
      }
      .message.user {
        display: flex;
        justify-content: flex-end;
        margin-top: 8px;
      }
      .bubble {
        max-width: 85%;
        padding: 11px 17px;
        border-radius: 20px 20px 4px 20px;
        background: var(--soft);
        white-space: pre-wrap;
      }
      .message.assistant {
        padding-left: 32px;
        position: relative;
      }
      .assistant .avatar {
        position: absolute;
        left: 0;
        top: 3px;
        color: var(--accent);
      }
      .message p {
        margin: 0 0 12px;
      }
      .message p:last-child {
        margin-bottom: 0;
      }
      .message h3 {
        font-size: 15px;
        margin: 18px 0 7px;
      }
      .message ul {
        padding-left: 20px;
        margin: 7px 0 16px;
      }
      .sources {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border: 0;
        background: none;
        font-size: 12px;
        color: var(--muted);
        padding: 5px 0;
      }
      .sources svg {
        width: 14px;
        height: 14px;
      }
      .actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 13px;
      }
      .primary {
        background: var(--accent);
        color: white;
        border: 1px solid var(--accent);
        padding: 10px 15px;
        border-radius: 10px;
        font-size: 13px;
        font-weight: 500;
      }
      .secondary {
        background: white;
        border: 1px solid var(--line);
        padding: 10px 13px;
        border-radius: 10px;
        font-size: 13px;
      }
      .attachment {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 10px 13px;
        margin: 7px 0;
        font-size: 13px;
        background: white;
        max-width: 100%;
      }
      .attachment svg {
        color: var(--accent);
        flex: none;
      }
      .attachment small {
        color: var(--muted);
        display: block;
        font-size: 11px;
      }
      .question {
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 18px;
        margin: 14px 0;
        max-width: 460px;
        background: #fafbf8;
      }
      .question h3 {
        margin: 0 0 5px;
      }
      .question p {
        font-size: 13px;
        color: var(--muted);
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-top: 14px;
        font-size: 13px;
      }
      .field input,
      .field select {
        background: white;
        border: 1px solid var(--line);
        border-radius: 9px;
        padding: 10px;
        min-width: 0;
        color: var(--ink);
        width: 100%;
      }
      .two-fields {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .check {
        font-size: 12px;
        display: flex;
        gap: 8px;
        align-items: flex-start;
        margin-top: 13px;
        line-height: 1.5;
      }
      .check input {
        accent-color: var(--accent);
        margin-top: 3px;
      }
      .change-row {
        display: flex;
        align-items: center;
        gap: 12px;
        border-bottom: 1px solid var(--line);
        padding: 11px 0;
        font-size: 13px;
      }
      .change-row:last-of-type {
        border-bottom: 0;
      }
      .change-row span {
        flex: 1;
      }
      .change-row small {
        display: block;
        color: var(--muted);
      }
      .change-row input {
        accent-color: var(--accent);
      }
      .composer-wrap {
        padding: 5px 24px 15px;
      }
      .composer {
        max-width: 710px;
        margin: auto;
        border: 1px solid #ccd6cb;
        border-radius: 24px;
        background: #fafbf8;
        padding: 13px 14px 9px;
      }
      .composer textarea {
        display: block;
        width: 100%;
        min-height: 28px;
        max-height: 130px;
        resize: none;
        background: transparent;
        border: 0;
        outline: none;
        font-size: 15px;
        line-height: 1.55;
        color: var(--ink);
        padding: 0 4px;
      }
      .composer textarea::placeholder {
        color: #7b887f;
      }
      .composer-bottom {
        display: flex;
        align-items: center;
        gap: 5px;
        margin-top: 7px;
      }
      .composer-bottom .spacer {
        flex: 1;
      }
      .send {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: 0;
        background: var(--accent);
        color: white;
        display: grid;
        place-items: center;
      }
      .send svg {
        width: 17px;
        height: 17px;
      }
      .composer-note {
        font-size: 10px;
        color: #7b887f;
        text-align: center;
        margin: 7px 0 0;
      }
      .draft-file {
        max-width: 710px;
        margin: 0 auto 8px;
        font-size: 12px;
        color: var(--muted);
      }
      .tabs {
        display: none;
        justify-content: space-around;
        padding: 10px 4px max(10px, env(safe-area-inset-bottom));
        border-top: 1px solid var(--line);
        background: white;
        gap: 2px;
      }
      .tabs button {
        border: 0;
        background: transparent;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
        font-size: 9px;
        color: var(--muted);
        min-width: 50px;
      }
      .tabs button.active {
        color: var(--accent);
      }
      .overlay {
        position: fixed;
        inset: 40px 0 0;
        background: #192d252d;
        display: flex;
        justify-content: flex-end;
        z-index: 20;
      }
      .sheet {
        width: 400px;
        max-width: 100%;
        height: 100%;
        background: white;
        overflow: auto;
        padding: 24px;
        animation: enter 0.18s ease;
      }
      .sheet header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 22px;
      }
      .sheet h2 {
        font-size: 19px;
        margin: 0;
        font-weight: 600;
      }
      .sheet h3 {
        font-size: 14px;
      }
      .sheet p {
        font-size: 14px;
        line-height: 1.65;
        color: var(--muted);
      }
      .source-block {
        padding: 16px 0;
        border-top: 1px solid var(--line);
      }
      .source-block a {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        font-size: 13px;
        color: var(--accent);
        text-decoration: none;
      }
      .small-label {
        font-size: 11px;
        letter-spacing: 0.04em;
        color: var(--muted);
      }
      .doc-preview {
        padding: 23px;
        background: var(--bg);
        border-radius: 12px;
      }
      .doc-preview h3 {
        font-size: 18px;
        margin: 10px 0;
      }
      .doc-preview p {
        font-size: 13px;
      }
      .toast {
        position: fixed;
        bottom: 120px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--ink);
        color: white;
        padding: 11px 17px;
        border-radius: 12px;
        font-size: 12px;
        z-index: 40;
        max-width: 90%;
        text-align: center;
      }
      .pending {
        font-size: 13px;
        color: var(--muted);
        padding-left: 32px;
        margin-bottom: 24px;
        display: flex;
        align-items: center;
        gap: 9px;
      }
      .dots {
        display: inline-flex;
        gap: 3px;
      }
      .dots i {
        height: 4px;
        width: 4px;
        border-radius: 50%;
        background: var(--muted);
        animation: pulse 1s infinite;
      }
      .dots i:nth-child(2) {
        animation-delay: 0.15s;
      }
      .dots i:nth-child(3) {
        animation-delay: 0.3s;
      }
      .plan {
        margin: 14px 0;
        max-width: 440px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--bg);
        padding: 15px;
      }
      .plan svg {
        height: auto;
        width: 100%;
        stroke: none;
      }
      .plan p {
        font-size: 11px;
        color: var(--muted);
        margin: 8px 0 0;
      }
      .mobile-preview.app {
        width: 430px;
        max-width: 100%;
        height: calc(100dvh - 65px);
        max-height: 880px;
        margin: 12px auto;
        border: 1px solid var(--line);
        border-radius: 24px;
        overflow: hidden;
      }
      .mobile-preview .sidebar {
        display: none;
      }
      .mobile-preview .menu-toggle {
        display: inline-flex;
      }
      .mobile-preview .tabs {
        display: flex;
      }
      .mobile-preview .top {
        padding: 0 10px;
        min-height: 58px;
      }
      .mobile-preview .store {
        display: none;
      }
      .mobile-preview .stream {
        padding: 12px 17px 16px;
      }
      .mobile-preview .composer-wrap {
        padding: 5px 13px 10px;
      }
      .mobile-preview .welcome {
        margin-top: 60px;
      }
      .mobile-preview .welcome h2 {
        font-size: 26px;
      }
      .mobile-preview .message {
        font-size: 14px;
      }
      .mobile-preview .message.assistant {
        padding-left: 27px;
      }
      .mobile-preview .sidebar.shown {
        display: flex;
        position: fixed;
        left: 0;
        top: 40px;
        bottom: 0;
        z-index: 30;
        width: 260px;
      }
      .mobile-preview .message.user .bubble {
        max-width: 93%;
      }
      .mobile-preview .question {
        padding: 15px;
      }
      .mobile-preview .two-fields {
        gap: 8px;
      }
      @keyframes pulse {
        50% {
          opacity: 0.25;
        }
      }
      @keyframes enter {
        from {
          transform: translateX(15px);
          opacity: 0.5;
        }
        to {
          transform: translateX(0);
          opacity: 1;
        }
      }
      @media (max-width: 700px) {
        .demo {
          padding: 0 9px;
          gap: 5px;
        }
        .demo strong {
          max-width: 145px;
          font-size: 10px;
        }
        .demo select {
          max-width: 110px;
          font-size: 10px;
        }
        .demo button {
          font-size: 10px;
        }
        .sidebar {
          display: none;
        }
        .sidebar.shown {
          display: flex;
          position: fixed;
          left: 0;
          top: 40px;
          bottom: 0;
          z-index: 30;
          width: 260px;
        }
        .menu-toggle {
          display: inline-flex;
        }
        .top {
          padding: 0 10px;
          min-height: 58px;
        }
        .store {
          display: none;
        }
        .tabs {
          display: flex;
        }
        .stream {
          padding: 12px 17px 16px;
        }
        .composer-wrap {
          padding: 5px 13px 10px;
        }
        .message {
          font-size: 14px;
        }
        .message.assistant {
          padding-left: 27px;
        }
        .welcome {
          margin-top: 55px;
        }
        .welcome h2 {
          font-size: 26px;
        }
        .question {
          padding: 15px;
        }
        .mobile-preview.app {
          border: 0;
          border-radius: 0;
          margin: 0;
          height: calc(100dvh - 40px);
          max-height: none;
          width: 100%;
        }
        .composer-note {
          font-size: 9px;
        }
        .two-fields {
          gap: 8px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="demo">
      <strong>Maquette · données fictives · sans IA</strong
      ><span class="spacer"></span><label for="scenario">Parcours</label
      ><select id="scenario">
        <option value="start">Accueil</option>
        <option value="week">Fichier manquant</option>
        <option value="form">Petit formulaire</option>
        <option value="products">Correction produits</option>
        <option value="email">Réception email</option>
        <option value="web">Recherche web</option>
        <option value="layout">Implantation</option></select
      ><button id="mobile">Vue mobile</button
      ><button id="reset">Recommencer</button>
    </div>
    <div id="app" class="app">
      <aside id="sidebar" class="sidebar">
        <div class="brand"><span data-icon="leaf"></span>Fruits & Légumes</div>
        <button class="new" id="new">
          <span data-icon="plus"></span>Nouvelle conversation
        </button>
        <div class="nav-title">Conversations</div>
        <div id="conversations"></div>
        <div class="sidebar-bottom">
          <button id="memory">
            <span data-icon="spark"></span>Mémoire du magasin
          </button>
          <div class="profile">
            <span class="initials">JM</span
            ><span
              >Julien<small
                style="display: block; color: var(--muted); font-size: 11px"
                >Asnières-sur-Seine</small
              ></span
            >
          </div>
        </div>
      </aside>
      <main class="main">
        <header class="top">
          <button
            class="icon menu-toggle"
            id="menu"
            aria-label="Ouvrir les conversations"
          >
            <span data-icon="menu"></span>
          </button>
          <h1>Copilote</h1>
          <span class="spacer"></span
          ><span class="store">Asnières-sur-Seine · 92600</span
          ><span id="connection"></span
          ><button
            class="icon"
            id="offline"
            aria-label="Simuler le mode hors connexion"
            title="Tester hors connexion"
          >
            <span data-icon="wifi"></span></button
          ><button
            class="icon"
            id="more"
            aria-label="Détails de la conversation"
          >
            <span data-icon="more"></span>
          </button>
        </header>
        <div id="stream" class="stream" aria-live="polite">
          <div id="thread" class="thread"></div>
        </div>
        <div class="composer-wrap">
          <div id="draft-file" class="draft-file"></div>
          <form id="composer" class="composer">
            <textarea
              id="input"
              rows="1"
              aria-label="Message au copilote"
              placeholder="Demande au copilote…"
            ></textarea>
            <div class="composer-bottom">
              <button
                class="icon"
                type="button"
                id="attach"
                aria-label="Joindre un fichier ou une photo"
              >
                <span data-icon="plus"></span></button
              ><span class="spacer"></span
              ><button
                class="send"
                type="submit"
                id="send"
                aria-label="Envoyer le message"
              >
                <span data-icon="up"></span>
              </button>
            </div>
          </form>
          <p class="composer-note">
            Maquette interactive. Aucun fichier lu ou transmis, aucune donnée
            métier modifiée.
          </p>
        </div>
        <nav class="tabs" aria-label="Navigation principale">
          <button class="active" data-nav="today">
            <span data-icon="chat"></span>Aujourd’hui</button
          ><button data-nav="week">
            <span data-icon="calendar"></span>Ma semaine</button
          ><button data-nav="analysis">
            <span data-icon="chart"></span>Analyses</button
          ><button data-nav="waste">
            <span data-icon="camera"></span>Casse</button
          ><button data-nav="more"><span data-icon="menu"></span>Plus</button>
        </nav>
      </main>
    </div>
    <div id="modal"></div>
    <input
      type="file"
      id="file"
      multiple
      hidden
      accept=".xlsx,.xls,.csv,.pdf,image/*"
    />
    <div id="toast" hidden class="toast" role="status"></div>
    <script>
      const icons = {
        leaf: '<path d="M20 4C10 2 3 6 4 14c4 6 12 4 16-10Z"/><path d="M5 19 15 9"/>',
        plus: '<path d="M12 5v14M5 12h14"/>',
        up: '<path d="m6 11 6-6 6 6M12 5v14"/>',
        menu: '<path d="M4 6h16M4 12h16M4 18h16"/>',

        if (type === "cost") {
          const raw = String(data.get("cost")).replace(",", ".");
          if (!Number.isFinite(Number(raw)) || Number(raw) < 0) {
            toast("Saisis un montant positif ou nul.");
            return;
          }
          chat().cost = raw;
          retireForm(f, "Coût renseigné dans la démonstration.");
          add(
            "user",
            `Le coût d’achat est de ${raw.replace(".", ",")} € HT / kg.`,
          );
          answer(
            '<p>Merci, ce coût est renseigné pour la démonstration.</p><p>Pour conclure sur la marge, je rapprocherai ce montant du prix de vente comparable et du mix des ventes. Je ne peux pas comparer directement un coût HT et un prix TTC.</p><div class="actions"><button class="secondary" data-action="sources" data-kind="cost">Voir les informations</button></div>',
          );
        }
        if (type === "products") {
          const n =
            Number(data.has("banana")) +
            Number(data.has("apple")) +
            Number(Boolean(data.get("melon")));
          if (!n) {
            toast("Choisis au moins une correction.");
            return;
          }
          const previousUnits = { ...state.units };
          if (data.has("banana")) state.units.banana = "Kilogramme";
          if (data.has("apple")) state.units.apple = "Kilogramme";
          retireForm(f, "Corrections appliquées dans la démonstration.");
          add("user", `Appliquer ${n} correction(s).`);
          answer(
            `<p>${n} correction(s) appliquée(s) dans la démonstration.</p><div class="actions"><button class="secondary" data-action="product-detail">Voir la fiche produit</button><button class="sources" data-action="undo" data-previous="${escape(JSON.stringify(previousUnits))}">Annuler les corrections</button></div>`,
          );
        }
        if (type === "layout") {
          const w = Number(String(data.get("width")).replace(",", ".")),
            d = Number(String(data.get("depth")).replace(",", ".")),
            n = Number(data.get("tg"));
          if (!(w > 0 && d > 0 && w <= 50 && d <= 50)) {
            toast("Saisis des dimensions entre 0 et 50 mètres.");
            return;
          }
          if (data.has("remember")) {
            state.memory.width = String(data.get("width"));
            state.memory.depth = String(data.get("depth"));
            state.memory.tg = String(n);
          }
          retireForm(f, "Dimensions renseignées dans la démonstration.");
          add("user", `L’espace fait ${w} × ${d} m, avec ${n} TG.`);
          const boxes = Array.from(
            { length: n },
            (_, i) =>
              `<rect x="${32 + i * 68}" y="38" width="52" height="48" rx="5" fill="#e7f1ea" stroke="#235c3d"/><text x="${58 + i * 68}" y="66" font-size="11" fill="#235c3d" text-anchor="middle">TG ${i + 1}</text>`,
          ).join("");
          answer(
            `<p>Je pars sur ${n} TG dans cet espace. Voici un schéma pour discuter de leur répartition.</p><div class="plan"><svg viewBox="0 0 340 150" aria-label="Schéma indicatif de démonstration avec ${n} TG"><rect x="8" y="8" width="324" height="126" rx="8" fill="white" stroke="#dfe6dd"/>${boxes}<text x="170" y="116" text-anchor="middle" font-size="10" fill="#59685f">Passage à confirmer</text></svg><p>Schéma fictif, pas à l’échelle. Aucune image IA générée. Les dimensions des meubles et passages restent à valider.</p></div><p>Tu préfères regrouper les offres fortes à l’entrée, ou les répartir dans le rayon ?</p>`,
          );
        }
        if (type === "memory") {
          state.memory.width = String(data.get("width"));
          state.memory.depth = String(data.get("depth"));
          state.memory.note = String(data.get("note"));
          save();
          $("#modal").innerHTML = "";
          toast(
            "Repère conservé pour les autres conversations de démonstration",
          );
        }
        if (type === "rename") {
          chat().title = String(data.get("title"));
          $("#modal").innerHTML = "";
          render();
        }
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          closeSheet();
          $("#sidebar").classList.remove("shown");
        }
        if (e.key === "Tab" && $("#modal").firstChild) {
          const nodes = [
            ...$("#modal").querySelectorAll(
              "button,input,select,textarea,a[href]",
            ),
          ].filter((n) => !n.disabled);
          if (nodes.length) {
            if (e.shiftKey && document.activeElement === nodes[0]) {
              e.preventDefault();
              nodes[nodes.length - 1].focus();
            } else if (
              !e.shiftKey &&
              document.activeElement === nodes[nodes.length - 1]
            ) {
              e.preventDefault();
              nodes[0].focus();
            }
          }
        }
      });
      render();
    </script>
  </body>
</html>
